name: release

# Automatic rolling releases: every push to master rebuilds the 6 standalone
# binaries and recreates the `latest` GitHub release. Manual runs from the
# Actions tab do the same thing.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-native-packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Stock GitHub runners are small and the cache starts cold,
    # so allow headroom on the first runs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: result/bin/ccusage
          - name: build-linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: macos-15
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-mac-x64
            os: macos-15
            platform: darwin
            arch: x64
            binary: result/bin/ccusage
          - name: build-windows-arm64
            os: windows-11-arm
            platform: win32
            arch: arm64
            binary: rust/target/release/ccusage.exe
          - name: build-windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}

  release:
    needs: build-native-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      # Ship the built binaries directly — each native package holds exactly
      # one file, so archives add nothing. Filenames stay stable (no version)
      # so download URLs never change; the release title carries the version.
      - name: Collect standalone binaries
        run: |
          cd "${{ runner.temp }}/native-packages"
          for archive in ccusage-native-*.tar; do tar -xf "$archive"; done
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for spec in linux:arm64 linux:x64 darwin:arm64 darwin:x64; do
            platform="${spec%%:*}"
            arch="${spec##*:}"
            cp "packages/ccusage-$platform-$arch/bin/ccusage" \
              "$GITHUB_WORKSPACE/dist/ccusage-$platform-$arch"
          done
          for arch in arm64 x64; do
            cp "packages/ccusage-win32-$arch/bin/ccusage.exe" \
              "$GITHUB_WORKSPACE/dist/ccusage-win32-$arch.exe"
          done
      - name: Read package version
        id: version
        run: echo "value=$(jq -r .version apps/ccusage/package.json)" >> "$GITHUB_OUTPUT"
      - name: Recreate rolling latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "ccusage v${{ steps.version.outputs.value }}" --notes "Automated rolling build from master at ${{ github.sha }}."
