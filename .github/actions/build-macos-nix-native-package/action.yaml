name: Build macOS Nix native package
description: Build, stage, archive, and upload a macOS ccusage native package with Nix
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
  cache-scope:
    description: >
      Unique matrix-entry identifier (the matrix `name`) used to scope the
      macOS Nix cache. arm64 and x64 share the same arm64 runner, so without a
      per-leg scope the two builds clobber one cache.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-cache
      id: nix
      with:
        cache-scope: ${{ inputs.cache-scope }}
        defer-save: 'true'

    - name: Build macOS binary
      id: build
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        # arm64 builds natively; x64 cross-compiles on this same arm64 runner
        # (the Apple SDK is multi-arch), so no separate Intel runner is needed.
        case "$ARCH" in
          x64)
            package=ccusage-darwin-x64
            ;;
          arm64)
            package=ccusage
            ;;
          *)
            echo "Unsupported arch: $ARCH" >&2
            exit 1
            ;;
        esac
        echo "package=$package" >> "$GITHUB_OUTPUT"
        nix build ".#$package" --print-build-logs

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: apps/ccusage/scripts/stage-native-package.nu --platform darwin --arch "$ARCH" --binary "$BINARY"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-darwin-$ARCH.tar" "packages/ccusage-darwin-$ARCH/bin"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccusage-native-darwin-${{ inputs.arch }}
        path: ccusage-native-darwin-${{ inputs.arch }}.tar
        if-no-files-found: error

    # An explicit step rather than cache-nix-action's post-job save. This action
    # runs inside another composite action, and a nested action's post-job step
    # does not see the composite's step outputs, so the save inside
    # setup-nix-cache would reach post-job with an empty primary-key and fail
    # with "Input required and not supplied: primary-key". See
    # setup-nix-cache's defer-save input.
    - name: Save Nix store
      if: steps.nix.outputs.save == 'true'
      uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ steps.nix.outputs.primary-key }}
        gc-max-store-size-macos: '0'
