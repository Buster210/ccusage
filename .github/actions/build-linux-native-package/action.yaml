name: Build Linux native package
description: Build, stage, archive, and upload a Linux ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
  nix-github-token:
    description: Whether Nix builds may use the GitHub token from Nix config
    default: 'true'
  cache-scope:
    description: >
      Unique matrix-entry identifier (the matrix `name`) used to scope the Nix
      cache so the arm64 and x64 legs do not share one key.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-cache
      id: nix
      with:
        cache-scope: ${{ inputs.cache-scope }}
        gc-max-store-size-linux: 4G
        defer-save: 'true'

    - name: Build Linux static binary
      shell: bash
      env:
        NIX_GITHUB_TOKEN: ${{ inputs.nix-github-token }}
      run: |
        if [ "$NIX_GITHUB_TOKEN" = "false" ]; then
          NIX_CONFIG="access-tokens =" nix build .#ccusage-static --print-build-logs
        else
          nix build .#ccusage-static --print-build-logs
        fi

    - name: Root current Crane artifacts for cache save
      shell: bash
      run: |
        system="$(nix eval --impure --raw --expr builtins.currentSystem)"
        nix build ".#packages.$system.ccusage-static.passthru.workspaceArtifacts.cacheRoot" \
          --out-link "$RUNNER_TEMP/ccusage-cargo-artifacts"

    - name: Verify Linux binary is static
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        file "$BINARY"
        if ldd "$BINARY" > "$RUNNER_TEMP/ldd.txt" 2>&1; then
          cat "$RUNNER_TEMP/ldd.txt"
          grep -Eiq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/ldd.txt"
        else
          cat "$RUNNER_TEMP/ldd.txt"
          grep -Eiq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/ldd.txt"
        fi

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: apps/ccusage/scripts/stage-native-package.nu --platform linux --arch "$ARCH" --binary "$BINARY"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-linux-$ARCH.tar" "packages/ccusage-linux-$ARCH/bin"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccusage-native-linux-${{ inputs.arch }}
        path: ccusage-native-linux-${{ inputs.arch }}.tar
        if-no-files-found: error

    # An explicit step rather than cache-nix-action's post-job save. This action
    # runs inside another composite action, and a nested action's post-job step
    # does not see the composite's step outputs, so the save inside
    # setup-nix-cache would reach post-job with an empty primary-key and fail
    # with "Input required and not supplied: primary-key". See
    # setup-nix-cache's defer-save input.
    - name: Save Nix store
      if: steps.nix.outputs.save == 'true'
      uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ steps.nix.outputs.primary-key }}
        gc-max-store-size-linux: 4G
