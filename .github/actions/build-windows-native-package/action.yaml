name: Build Windows native package
description: Build, stage, archive, and upload a Windows ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-native-build-cache
      with:
        platform: win32

    - name: Install fork-pinned Rust toolchain
      shell: bash
      # Nix cannot target Windows, so this job uses the runner's rustup.
      # Install the exact channel from rust-toolchain.toml (read here, not
      # duplicated) so this build uses the same compiler as the dev shell
      # and the Nix CI jobs instead of the runner's floating default.
      run: |
        TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
        rustup toolchain install "$TOOLCHAIN" --profile minimal

    - name: Build Cargo native binary
      shell: bash
      # Nix cannot target Windows, so this is the one build that downloads the
      # LiteLLM pricing snapshot instead of reading it from the pinned input.
      run: cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: |
        mkdir -p "packages/ccusage-win32-$ARCH/bin"
        cp "$BINARY" "packages/ccusage-win32-$ARCH/bin/ccusage.exe"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-win32-$ARCH.tar" "packages/ccusage-win32-$ARCH/bin"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccusage-native-win32-${{ inputs.arch }}
        path: ccusage-native-win32-${{ inputs.arch }}.tar
        if-no-files-found: error
